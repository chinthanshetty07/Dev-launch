# Two jobs, split by what they need.
#
# `check` needs nothing but Node and runs on every push: typecheck plus the unit suites,
# about a minute, and a secret scan. `integration` needs a Docker daemon, takes 20–30
# minutes, and runs where that cost is worth paying: pull requests, nightly, and by hand.
#
# `integration` installs DevLaunch the way a new user does (`./devlaunch install`: runner
# images built in the job, so the Dockerfiles are tested too, and the guard started), on a
# fresh Linux machine running Docker Engine — so it is also the proof that DevLaunch runs
# somewhere other than the Mac it was written on, including under the systemd cgroup driver.
name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly, so the integration suite runs even on a quiet week.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The pnpm version comes from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The oldest Node DevLaunch supports, so a newer API never slips in unnoticed.
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: |
          for pkg in packages/shared apps/backend apps/frontend; do
            (cd "$pkg" && ./node_modules/.bin/tsc --noEmit)
          done

      - name: unit tests
        run: |
          (cd packages/shared && ./node_modules/.bin/vitest run)
          (cd apps/frontend && ./node_modules/.bin/vitest run)
          (cd apps/backend && ./node_modules/.bin/vitest run --exclude '**/integration/**')

      - name: secret scan
        # Five API keys have been pasted into chat transcripts during development, and
        # the only check that has ever run is `git log -S 'gsk_'` — one prefix, history
        # only. This is the general case that check is not.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    name: install, real-Docker tests, uninstall (Linux)
    # Pull requests, the nightly run, and by hand. Every push would spend half an hour to
    # re-prove what the previous push proved.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Docker on this machine
        run: docker info --format 'Docker {{.ServerVersion}}, cgroup driver {{.CgroupDriver}} v{{.CgroupVersion}}, {{.OperatingSystem}}, {{.Architecture}}'

      - name: install, as a new user would
        run: ./devlaunch install

      - name: doctor
        run: node scripts/doctor.mjs

      - name: full suite
        # No GROQ_API_KEY: the live-model tests skip, as they do for anyone without one.
        run: cd apps/backend && ./node_modules/.bin/vitest run

      - name: nothing was left behind
        # Container residue is a real failure mode here — teardown has regressed before —
        # and this is the cheapest check that exists for it. Run networks too.
        run: |
          containers=$(docker ps -a --filter label=com.devlaunch.managed -q | wc -l | tr -d ' ')
          test "$containers" -eq 0 || { echo "$containers container(s) left behind"; exit 1; }
          networks=$(docker network ls -q --filter label=com.devlaunch.runnet=true | wc -l | tr -d ' ')
          test "$networks" -eq 0 || { echo "$networks run network(s) left behind"; exit 1; }

      - name: the readiness report is still accurate
        run: SKIP_TESTS=1 ./scripts/verify-readiness.sh

      - name: guard log
        if: always()
        run: docker logs devlaunch-guard || true

      - name: uninstall leaves nothing of DevLaunch's behind
        run: |
          ./devlaunch uninstall
          left=$( { docker ps -aq --filter label=com.devlaunch.managed=true; \
                    docker ps -aq --filter name=devlaunch-guard; \
                    docker network ls -q --filter label=com.devlaunch.runnet=true; \
                    docker network ls -q --filter name=devlaunch-net; \
                    docker volume ls -q --filter label=com.devlaunch.workspace=true; \
                    docker images -q 'devlaunch/*'; docker images -q 'devlaunch-built/*'; } | wc -l)
          echo "DevLaunch items left: $left"
          test "$left" -eq 0
          if sudo iptables -S DOCKER-USER 2>/dev/null | grep -q DEVLAUNCH; then echo "rules left behind"; exit 1; fi
          echo "rules removed"

  installer:
    name: installer on a bare Linux machine
    # Same schedule as the integration job: it downloads Docker and Node from the internet.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: make this machine bare — no Docker, no Node, no git, and not in the docker group
        run: |
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo apt-get purge -y -qq 'docker-ce*' 'docker-buildx*' 'docker-compose*' 'moby-*' containerd.io >/dev/null 2>&1 || true
          # git with its parts and the extra source this image installs it from: removing git
          # alone left a newer git-man that Ubuntu's own git cannot install beside.
          sudo apt-get purge -y -qq git git-man >/dev/null 2>&1 || true
          sudo rm -f /etc/apt/sources.list.d/*git-core* && sudo apt-get update -qq
          sudo apt-get autoremove -y -qq >/dev/null 2>&1 || true
          sudo rm -rf /var/lib/docker /etc/docker /usr/bin/docker /usr/local/bin/docker
          sudo gpasswd -d "$USER" docker 2>/dev/null || true
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin
          for t in docker node git; do command -v $t && { echo "$t is still here"; exit 1; } || echo "no $t"; done

      - name: run the installer, as someone would
        run: |
          # Without the runner's own Node and tools on the PATH, as on a new computer.
          env -i HOME="$HOME" USER="$USER" PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            DEVLAUNCH_YES=1 DEVLAUNCH_NO_START=1 \
            DEVLAUNCH_REPO="$GITHUB_WORKSPACE" DEVLAUNCH_DIR="$HOME/devlaunch" \
            bash install.sh

      - name: start it in a new shell and run an app to READY
        run: |
          cd "$HOME/devlaunch"
          # A new shell, still without the docker group (that needs a new login): the
          # devlaunch command must cope by itself.
          env -i HOME="$HOME" USER="$USER" PATH=/usr/sbin:/usr/bin:/sbin:/bin ./devlaunch doctor
          env -i HOME="$HOME" USER="$USER" PATH=/usr/sbin:/usr/bin:/sbin:/bin nohup ./devlaunch start > /tmp/devlaunch.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:3939/api/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3939/api/health
          id=$(curl -sf -X POST http://127.0.0.1:3939/api/sessions -H 'content-type: application/json' \
                 -d '{"fixture":"node-http-basic"}' | jq -r .id)
          echo "session $id"
          for i in $(seq 1 120); do
            state=$(curl -sf http://127.0.0.1:3939/api/sessions/$id | jq -r .state)
            case "$state" in READY) echo "READY"; exit 0 ;; FAILED|CANCELLED) echo "ended $state"; break ;; esac
            sleep 3
          done
          echo "--- DevLaunch log:"; tail -60 /tmp/devlaunch.log
          exit 1
