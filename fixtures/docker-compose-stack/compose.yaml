services:
  api:
    build: ./api
    ports: ["8080:8080"]
    environment:
      DB_ADDR: db:5432
      CACHE_ADDR: cache:6379
    depends_on: [db, cache]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: example
    volumes: ["pgdata:/var/lib/postgresql/data"]
  cache:
    image: redis:7
volumes:
  pgdata: {}
